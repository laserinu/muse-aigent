[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# Skip test files here: the v4-core test utils pull in PoolManager, which
# uses transient storage (Cancun-only). Tests run under profile.test.
skip = ["test/**"]

# Tests need Cancun: the real v4-core PoolManager uses transient storage
# (tstore/tload). The deploy artifacts (token/collector/hook) are compiled
# with the default paris profile — the canonical bytecode for all four
# chains, since Arc is pre-Shanghai. Run tests with FOUNDRY_PROFILE=test.
# Test artifacts go to out-test/ so they never overwrite the canonical
# paris artifacts in out/.
[profile.test]
evm_version = "cancun"
out = "out-test"
skip = []
